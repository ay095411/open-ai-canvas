<!doctype html>
<html lang="zh-CN" class="font-sans dark" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <!-- 不写内置品牌资源：首屏必须品牌中性，favicon 由 use-appearance-store 解析出外观后写入。
             空 data URL 只是为了不让浏览器去请求 /favicon.ico（那会是一条 404）。 -->
        <link rel="icon" href="data:," />
        <title>正在加载</title>
        <style>
            /* Fix layer order before production chunks can register utilities ahead of base. */
            @layer theme, base, components, utilities;

            html,
            body {
                margin: 0;
                background: #111415;
            }
            html:not(.dark),
            html:not(.dark) body {
                background: #ffffff;
            }
            #boot-recovery {
                color: #171717;
            }
            html.dark #boot-recovery {
                color: #f5f5f5;
            }
            /* 启动过渡页：只留一根细线流光 + 大字距文案，靠留白与慢节奏出气质。
                纯 CSS、品牌中性；#root 渲染出内容后 :empty 失配，整层自然消失。 */
            #root:empty {
                min-height: 100vh;
            }
            /* 细线轨道，两端渐隐；流光与 FullScreenLoader 共用 performance.now() 相位。 */
            #root:empty::before {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 160px;
                height: 1px;
                margin: -0.5px 0 0 -80px;
                background: rgba(255, 255, 255, 0.1);
                -webkit-mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
                mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
                animation: boot-in 0.8s ease-out both;
            }
            html:not(.dark) #root:empty::before {
                background: rgba(20, 20, 20, 0.1);
            }
            /* 流光：一段柔光沿线扫过 */
            #root:empty::after {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 160px;
                height: 1px;
                margin: -0.5px 0 0 -80px;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
                background-size: 72px 100%;
                background-repeat: no-repeat;
                -webkit-mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
                mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
                animation:
                    boot-in 0.8s ease-out both,
                    boot-sweep 2.4s ease-in-out calc(-1 * var(--boot-signal-clock, 0ms)) infinite;
            }
            html:not(.dark) #root:empty::after {
                background-image: linear-gradient(90deg, transparent, rgba(20, 20, 20, 0.55), transparent);
            }
            /* 功能文案（非品牌） */
            body:has(#root:empty)::after {
                content: "正在加载";
                position: fixed;
                left: 50%;
                top: calc(50% + 28px);
                transform: translateX(-50%);
                font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
                font-size: 11px;
                font-weight: 500;
                line-height: 1;
                letter-spacing: 0.5em;
                text-indent: 0.5em;
                white-space: nowrap;
                color: rgba(255, 255, 255, 0.32);
                animation: boot-in 0.8s ease-out both;
            }
            html:not(.dark) body:has(#root:empty)::after {
                color: rgba(20, 20, 20, 0.4);
            }
            @keyframes boot-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            @keyframes boot-sweep {
                0% {
                    background-position: -72px 0;
                }
                100% {
                    background-position: 160px 0;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::after {
                    animation: boot-in 0.8s ease-out both;
                }
            }
            /* ---------- 启动兜底页（20s 未挂载） ----------
               不依赖任何外链资源，所以全部用字面值；只留标题、一句说明、一个按钮。 */
            #boot-recovery {
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                padding: 24px;
                background: #ffffff;
                color: #171717;
                font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
                text-align: center;
                animation: boot-in 0.24s ease-out both;
            }
            html.dark #boot-recovery {
                background: #111415;
                color: #f5f5f5;
            }
            /* 出现兜底时必须收掉启动流光与「正在加载」伪元素，否则它们会压在按钮上形成重影。 */
            body.boot-recovery-open #root:empty::before,
            body.boot-recovery-open #root:empty::after {
                display: none;
            }
            body.boot-recovery-open::after {
                content: none !important;
            }
            #boot-recovery strong {
                font-size: 15px;
                font-weight: 650;
                line-height: 1.4;
            }
            #boot-recovery p {
                margin: 0;
                max-width: 36em;
                color: rgba(20, 20, 20, 0.6);
                font-size: 13px;
                line-height: 1.7;
                text-wrap: pretty;
            }
            html.dark #boot-recovery p {
                color: rgba(255, 255, 255, 0.55);
            }
            #boot-recovery button {
                margin-top: 6px;
                padding: 8px 20px;
                border: 1px solid rgba(20, 20, 20, 0.16);
                border-radius: 8px;
                background: transparent;
                color: inherit;
                font: inherit;
                font-size: 13px;
                cursor: pointer;
                transition: background-color 0.16s ease-out;
            }
            html.dark #boot-recovery button {
                border-color: rgba(255, 255, 255, 0.18);
            }
            #boot-recovery button:hover {
                background: rgba(20, 20, 20, 0.05);
            }
            html.dark #boot-recovery button:hover {
                background: rgba(255, 255, 255, 0.08);
            }
            #boot-recovery button:focus-visible {
                outline: 2px solid #e49a58;
                outline-offset: 2px;
            }
            @media (prefers-reduced-motion: reduce) {
                #boot-recovery {
                    animation: none;
                }
            }
        </style>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("yingce:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script>
            // 放在 #root 之后：外链样式加载完、首帧绘制前才执行，启动信号从这一刻对齐 performance.now()。
            document.getElementById("root").style.setProperty("--boot-signal-clock", performance.now() + "ms");
            // 入口或其依赖失败时 React 尚未挂载，路由错误页无法接管；提供不依赖外链资源的退出入口。
            var bootRoot = document.getElementById("root");
            var bootTimer = setTimeout(function () {
                if (bootRoot.childNodes.length) return;
                var notice = document.createElement("section");
                notice.id = "boot-recovery";
                notice.setAttribute("role", "alert");

                var title = document.createElement("strong");
                title.textContent = "页面资源加载时间过长";

                var detail = document.createElement("p");
                detail.textContent = "部分启动资源未能加载，请重试。此操作不会清除浏览器中的画布缓存。";

                var retry = document.createElement("button");
                retry.type = "button";
                retry.textContent = "重新加载";
                retry.onclick = function () {
                    var url = new URL(location.href);
                    url.searchParams.set("__chunk_recovery", String(Date.now()));
                    location.replace(url.toString());
                };

                notice.append(title, detail, retry);
                document.body.appendChild(notice);
                document.body.classList.add("boot-recovery-open");
            }, 20000);
            var bootObserver = new MutationObserver(function () {
                if (!bootRoot.childNodes.length) return;
                clearTimeout(bootTimer);
                bootObserver.disconnect();
                var notice = document.getElementById("boot-recovery");
                if (notice) notice.remove();
                document.body.classList.remove("boot-recovery-open");
            });
            bootObserver.observe(bootRoot, { childList: true });
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
