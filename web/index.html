<!doctype html>
<html lang="zh-CN" class="font-sans dark" style="color-scheme: dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="AI 影视与短剧创作工作台" />
        <!-- 不写内置品牌资源：首屏必须品牌中性，favicon 由 use-appearance-store 解析出外观后写入。
             空 data URL 只是为了不让浏览器去请求 /favicon.ico（那会是一条 404）。 -->
        <link rel="icon" href="data:," />
        <title>正在加载</title>
        <style>
            /* Fix layer order before production chunks can register utilities ahead of base. */
            @layer theme, base, components, utilities;

            html,
            body {
                margin: 0;
                background: #111415;
            }
            html:not(.dark),
            html:not(.dark) body {
                background: #ffffff;
            }
            /* 启动过渡页：只留一根细线流光 + 轻状态文案，靠留白与慢节奏出气质。
                纯 CSS、品牌中性；#root 渲染出内容后 :empty 失配，整层自然消失。 */
            #root:empty {
                min-height: 100vh;
            }
            /* 细线轨道，两端渐隐；流光与 FullScreenLoader 共用 performance.now() 相位。 */
            #root:empty::before {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 160px;
                height: 1px;
                margin: -0.5px 0 0 -80px;
                background: rgba(255, 255, 255, 0.1);
                -webkit-mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
                mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
                animation: boot-in 0.8s ease-out both;
            }
            html:not(.dark) #root:empty::before {
                background: rgba(20, 20, 20, 0.1);
            }
            /* 流光：一段柔光沿线扫过 */
            #root:empty::after {
                content: "";
                position: fixed;
                left: 50%;
                top: 50%;
                width: 160px;
                height: 1px;
                margin: -0.5px 0 0 -80px;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
                background-size: 72px 100%;
                background-repeat: no-repeat;
                -webkit-mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
                mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
                animation:
                    boot-in 0.8s ease-out both,
                    boot-sweep 2.4s ease-in-out calc(-1 * var(--boot-signal-clock, 0ms)) infinite;
            }
            html:not(.dark) #root:empty::after {
                background-image: linear-gradient(90deg, transparent, rgba(20, 20, 20, 0.55), transparent);
            }
            @keyframes boot-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            @keyframes boot-sweep {
                0% {
                    background-position: -72px 0;
                }
                100% {
                    background-position: 160px 0;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #root:empty::after {
                    animation: boot-in 0.8s ease-out both;
                }
            }
            /* ---------- 启动状态与兜底页 ----------
               默认仅在流光线下方展示轻状态文案；离线或资源真正失败时切换为全屏兜底页。 */
            #boot-recovery {
                position: fixed;
                inset-inline: 24px;
                top: calc(50% + 28px);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 14px;
                color: #171717;
                font-family: -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
                text-align: center;
                animation: boot-in 0.8s ease-out both;
            }
            html.dark #boot-recovery {
                color: #f5f5f5;
            }
            body.boot-recovery-open #boot-recovery {
                inset: 0;
                z-index: 2147483647;
                justify-content: center;
                padding: 24px;
                background: #ffffff;
                animation: boot-in 0.24s ease-out both;
            }
            html.dark body.boot-recovery-open #boot-recovery {
                background: #111415;
            }
            /* 出现兜底时必须收掉启动流光，否则它们会压在按钮上形成重影。 */
            body.boot-recovery-open #root:empty::before,
            body.boot-recovery-open #root:empty::after {
                display: none;
            }
            #boot-recovery p {
                margin: 0;
                max-width: 36em;
                color: rgba(20, 20, 20, 0.45);
                font-size: 11px;
                font-weight: 500;
                line-height: 1.6;
                letter-spacing: 0.35em;
                text-indent: 0.35em;
                text-wrap: pretty;
            }
            html.dark #boot-recovery p {
                color: rgba(255, 255, 255, 0.38);
            }
            body.boot-recovery-open #boot-recovery p {
                color: rgba(20, 20, 20, 0.72);
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0;
                text-indent: 0;
            }
            html.dark body.boot-recovery-open #boot-recovery p {
                color: rgba(255, 255, 255, 0.72);
            }
            #boot-recovery button {
                margin-top: 6px;
                padding: 8px 20px;
                border: 1px solid rgba(20, 20, 20, 0.16);
                border-radius: 8px;
                background: transparent;
                color: inherit;
                font: inherit;
                font-size: 13px;
                cursor: pointer;
                transition: background-color 0.16s ease-out;
            }
            html.dark #boot-recovery button {
                border-color: rgba(255, 255, 255, 0.18);
            }
            #boot-recovery button:hover {
                background: rgba(20, 20, 20, 0.05);
            }
            html.dark #boot-recovery button:hover {
                background: rgba(255, 255, 255, 0.08);
            }
            #boot-recovery button:focus-visible {
                outline: 2px solid #e49a58;
                outline-offset: 2px;
            }
            @media (prefers-reduced-motion: reduce) {
                #boot-recovery {
                    animation: none;
                }
            }
        </style>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("yingce:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <section id="boot-recovery" role="status" aria-live="polite">
            <p>正在打开创作空间</p>
            <button type="button" hidden>重新加载</button>
        </section>
        <script>
            // 放在 #root 之后：外链样式加载完、首帧绘制前才执行，启动信号从这一刻对齐 performance.now()。
            (() => {
                const bootRoot = document.getElementById("root");
                bootRoot.style.setProperty("--boot-signal-clock", performance.now() + "ms");
                const notice = document.getElementById("boot-recovery");
                const message = notice.querySelector("p");
                const retry = notice.querySelector("button");
                const entrySelector = 'script[type="module"][src]';
                let failed = false;
                let slow = false;
                let checkedVersion = false;

                function reload() {
                    var url = new URL(location.href);
                    url.searchParams.set("__chunk_recovery", String(Date.now()));
                    location.replace(url.toString());
                }

                function updateMessage() {
                    const offline = navigator.onLine === false;
                    message.textContent = offline ? "网络连接中断，请检查连接。" : failed ? "启动资源加载失败，请重试。" : slow ? "加载较慢，仍在继续…" : "正在打开创作空间";
                    retry.hidden = !offline && !failed;
                    document.body.classList.toggle("boot-recovery-open", offline || failed);
                }

                async function showFailure(status) {
                    if (bootRoot.childNodes.length) return;
                    failed = true;
                    updateMessage();
                    if (checkedVersion || (status !== 404 && status !== 410) || new URL(location.href).searchParams.has("__chunk_recovery")) return;
                    checkedVersion = true;
                    try {
                        const current = document.querySelector(entrySelector);
                        if (!current) return;
                        const response = await fetch(location.href, { cache: "no-store", signal: AbortSignal.timeout(5000) });
                        if (!response.ok) return;
                        const latest = new DOMParser().parseFromString(await response.text(), "text/html").querySelector(entrySelector);
                        if (!latest) return;
                        const entry = new URL(latest.getAttribute("src"), response.url || location.href);
                        if (!bootRoot.childNodes.length && entry.origin === new URL(location.href).origin && /^\/assets\/[^/]+\.js$/.test(entry.pathname) && entry.href !== current.src) reload();
                    } catch {
                        // 版本检查失败时保留手动恢复入口。
                    }
                }

                function onStartupFailure(event) {
                    void showFailure(event.detail.status);
                }

                async function onScriptFailure(event) {
                    const entry = document.querySelector(entrySelector);
                    if (!entry || event.target !== entry || bootRoot.childNodes.length) return;
                    let status;
                    try {
                        const response = await fetch(entry.src, { method: "HEAD", cache: "no-store", signal: AbortSignal.timeout(5000) });
                        status = response.status;
                    } catch {
                        // 原生模块报错可能来自下游依赖，只有确认缺失才检查版本。
                    }
                    await showFailure(status);
                }

                retry.onclick = reload;
                addEventListener("online", updateMessage);
                addEventListener("offline", updateMessage);
                addEventListener("starai:startup-load-failure", onStartupFailure);
                addEventListener("error", onScriptFailure, true);
                updateMessage();
                const bootTimer = setTimeout(() => {
                    slow = true;
                    updateMessage();
                }, 20000);
                const bootObserver = new MutationObserver(() => {
                    if (!bootRoot.childNodes.length) return;
                    clearTimeout(bootTimer);
                    bootObserver.disconnect();
                    removeEventListener("online", updateMessage);
                    removeEventListener("offline", updateMessage);
                    removeEventListener("starai:startup-load-failure", onStartupFailure);
                    removeEventListener("error", onScriptFailure, true);
                    notice.remove();
                    document.body.classList.remove("boot-recovery-open");
                });
                bootObserver.observe(bootRoot, { childList: true });
            })();
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
